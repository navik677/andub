name: Build & Release Andub (Windows)

on:
  push:
    branches: [ "windows-port" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "windows-port" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: "win64_msvc2022_64"
          modules: "qtimageformats"
          cache: true

      - name: Cache third-party binaries
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.ps1') }}

      - name: Build app, portable zip and installer
        run: ./scripts/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Andub-Windows-Setup
          path: dist/Andub-Setup-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Andub-Windows-Portable
          path: dist/Andub-Windows-x86_64.zip

  release:
    name: Publish Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Andub-Windows-Setup/Andub-Setup-x86_64.exe
            Andub-Windows-Portable/Andub-Windows-x86_64.zip
