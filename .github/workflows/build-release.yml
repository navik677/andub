name: Build & Release Andub

on:
  push:
    branches: [ "main", "ui-qt" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtimageformats"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libmpv-dev libcurl4-openssl-dev libfuse2 \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Andub-Linux-AppImage
          path: dist/Andub-x86_64.AppImage

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-curl

      - name: Build app and installer
        run: ./scripts/build_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Andub-Windows-Setup
          path: dist/Andub-Setup-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Andub-Windows-Portable
          path: dist/Andub-Windows-x86_64.zip

  release:
    name: Publish Release
    needs: [build-linux-appimage, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Andub-Linux-AppImage/Andub-x86_64.AppImage
            Andub-Windows-Setup/Andub-Setup-x86_64.exe
            Andub-Windows-Portable/Andub-Windows-x86_64.zip
