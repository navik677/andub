<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1f4a"/>
      <stop offset="1" stop-color="#160f27"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8b78"/>
      <stop offset="1" stop-color="#e8436a"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9405c"/>
      <stop offset="1" stop-color="#a92d55"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d3fd6"/>
      <stop offset="1" stop-color="#ff6f9f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="1" stop-color="#ffd6c4"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- soft glow behind the head -->
    <circle cx="256" cy="270" r="210" fill="#ff6a4d" opacity="0.12"/>

    <!-- back hair, falls past the bottom edge -->
    <path d="M86 520 C62 360 78 170 256 112 C434 170 450 360 426 520 Z" fill="url(#hairBack)"/>

    <!-- neck and shoulders -->
    <path d="M222 400 L290 400 L296 452 L216 452 Z" fill="#f6c9b6"/>
    <path d="M120 520 C130 462 180 440 256 440 C332 440 382 462 392 520 Z" fill="#2f2a44"/>
    <path d="M226 440 L256 486 L286 440 Z" fill="#ff6a4d"/>

    <!-- face -->
    <path d="M136 236 Q134 398 256 428 Q378 398 376 236 Z" fill="url(#skin)"/>

    <!-- eyes -->
    <g>
      <ellipse cx="200" cy="306" rx="33" ry="42" fill="#2a1640"/>
      <ellipse cx="200" cy="314" rx="26" ry="32" fill="url(#iris)"/>
      <ellipse cx="200" cy="318" rx="12" ry="15" fill="#1b0e2c"/>
      <circle cx="188" cy="294" r="10" fill="#ffffff"/>
      <circle cx="212" cy="330" r="4.5" fill="#ffffff"/>
      <path d="M162 300 Q162 262 200 262 Q230 262 240 284" fill="none" stroke="#2a1640" stroke-width="9" stroke-linecap="round"/>
      <path d="M168 276 L150 266" fill="none" stroke="#2a1640" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="312" cy="306" rx="33" ry="42" fill="#2a1640"/>
      <ellipse cx="312" cy="314" rx="26" ry="32" fill="url(#iris)"/>
      <ellipse cx="312" cy="318" rx="12" ry="15" fill="#1b0e2c"/>
      <circle cx="300" cy="294" r="10" fill="#ffffff"/>
      <circle cx="324" cy="330" r="4.5" fill="#ffffff"/>
      <path d="M350 300 Q350 262 312 262 Q282 262 272 284" fill="none" stroke="#2a1640" stroke-width="9" stroke-linecap="round"/>
      <path d="M344 276 L362 266" fill="none" stroke="#2a1640" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- blush and mouth -->
    <ellipse cx="168" cy="360" rx="20" ry="9" fill="#ff7f9c" opacity="0.55"/>
    <ellipse cx="344" cy="360" rx="20" ry="9" fill="#ff7f9c" opacity="0.55"/>
    <path d="M240 368 Q256 390 272 368 Z" fill="#c8455f"/>

    <!-- side locks -->
    <path d="M140 236 C114 318 120 404 98 470 C146 432 166 360 168 284 Z" fill="url(#hair)"/>
    <path d="M372 236 C398 318 392 404 414 470 C366 432 346 360 344 284 Z" fill="url(#hair)"/>

    <!-- bangs -->
    <path d="M116 272 C104 166 168 108 256 104 C344 108 408 166 396 272
             L370 214 L354 266 L322 192 L298 254 L262 182 L234 254 L206 192 L176 264 L158 214 L140 280 Z"
          fill="url(#hair)"/>
    <!-- ahoge -->
    <path d="M254 108 C244 66 280 46 304 62 C280 64 268 82 266 108 Z" fill="url(#hair)"/>
    <!-- hair shine -->
    <path d="M184 150 Q256 124 328 150" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round"/>

    <!-- headphones: band over the head, cups at the ears -->
    <path d="M112 262 C104 96 408 96 400 262" fill="none" stroke="#24203a" stroke-width="26" stroke-linecap="round"/>
    <rect x="76" y="228" width="70" height="112" rx="30" fill="#24203a"/>
    <rect x="366" y="228" width="70" height="112" rx="30" fill="#24203a"/>
    <rect x="90" y="248" width="20" height="72" rx="10" fill="#ff6a4d"/>
    <rect x="402" y="248" width="20" height="72" rx="10" fill="#ff6a4d"/>
  </g>
</svg>
